<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Acesso restrito &middot; RBA+</title>
<style>
  @font-face{font-family:"DM Mono";font-style:normal;font-weight:400;font-display:swap;src:url(/rba/assets/fontes/DMMono-400-latin.woff2) format("woff2")}
  @font-face{font-family:"DM Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(/rba/assets/fontes/DMSans-400-700-latin.woff2) format("woff2")}
  @font-face{font-family:"Space Grotesk";font-style:normal;font-weight:400 700;font-display:swap;src:url(/rba/assets/fontes/SpaceGrotesk-400-700-latin.woff2) format("woff2")}
  :root{--bg:#07090f;--surface:#10131f;--border:#1f2540;--border-ctl:#5b6489;--text:#e8ecf4;--muted:#9aa3bd;--faint:#7b84a1;
    --acao:#f3f5fa;--sobre-acao:#07090f;--sinal:#38bdf8;--indigo:#818cf8;--erro:#fb7185;
    --font-display:"Space Grotesk","DM Sans",-apple-system,system-ui,sans-serif;
    --font-sans:"DM Sans",-apple-system,system-ui,sans-serif;
    --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease-out:cubic-bezier(.2,.7,.2,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg);color-scheme:dark}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);
    font:14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-2;
    background:radial-gradient(40% 35% at 20% 10%,rgba(56,189,248,.10) 0%,transparent 70%),
      radial-gradient(35% 30% at 85% 80%,rgba(129,140,248,.09) 0%,transparent 70%);
    animation:aurora 36s ease-in-out infinite alternate}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(80% 60% at 50% 0%,#000 20%,transparent 100%);
    mask-image:radial-gradient(80% 60% at 50% 0%,#000 20%,transparent 100%)}
  @keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,4%,0) scale(1.06)}100%{transform:translate3d(-3%,-2%,0) scale(1.02)}}
  .card{width:100%;max-width:380px;visibility:hidden}
  .wordmark{display:block;height:22px;width:auto;color:var(--text)}
  .kicker{margin-top:56px;font:400 12px/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{margin-top:14px;font:500 44px/1 var(--font-display);letter-spacing:-.035em}
  h1 em{font-style:normal;background:linear-gradient(100deg,#fff 0%,var(--sinal) 60%,var(--indigo) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  p.sub{margin-top:16px;color:var(--muted);max-width:34ch}
  form{margin-top:32px;display:flex;flex-direction:column}
  label{font:500 13px/1.4 var(--font-sans);color:var(--text);margin-bottom:6px}
  input{width:100%;height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--border-ctl);border-radius:6px;
    color:var(--text);font:400 16px var(--font-sans);transition:border-color .18s var(--ease-out)}
  input:hover{border-color:var(--text)}
  input:focus-visible{outline:2px solid #fff;outline-offset:3px;box-shadow:0 0 0 5px rgba(7,9,15,.9)}
  button{margin-top:12px;width:100%;height:48px;border:1px solid var(--acao);border-radius:6px;background:var(--acao);color:var(--sobre-acao);
    font:600 14px var(--font-sans);cursor:pointer;transition:background .18s var(--ease-out)}
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid #fff;outline-offset:3px;box-shadow:0 0 0 5px rgba(7,9,15,.9)}
  button:disabled{background:transparent;color:var(--muted);border-color:var(--border-ctl);cursor:wait}
  .err{margin-top:12px;min-height:21px;font-size:14px;color:var(--erro);opacity:0;transition:opacity .18s}
  .err.show{opacity:1}
  .foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--border);font:400 12px/1.5 var(--font-mono);color:var(--faint)}
  @media (max-width:480px){.kicker{margin-top:40px}}
  @media (prefers-reduced-motion:reduce){body::before{animation:none}*{transition:none!important}}
</style>
</head>

  async function dec(pw){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    return new TextDecoder().decode(buf);
  }

    catch(ex){err.textContent='Senha incorreta. Tente novamente.';err.className='err show';btn.disabled=false;btn.textContent='Entrar';pw.value='';pw.focus();}
  });
  (async function(){
    var saved=null;try{saved=localStorage.getItem(K);}catch(_){}
    if(saved){try{var html=await dec(saved);render(html);return;}catch(e){try{localStorage.removeItem(K);}catch(_){}}}
    showGate();
  })();
</script>
