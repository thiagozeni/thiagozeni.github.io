<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Acesso restrito &middot; Grupo RBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0d1a;--card:#141829;--border:#1e2340;--border2:#2a3055;--text:#e2e8f0;--muted:#8892b0;--dim:#4a5270;--accent:#38bdf8;--accent2:#818cf8;--danger:#ef4444;--zn:#C6FF00;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 0%,rgba(56,189,248,.06) 0%,transparent 45%),radial-gradient(ellipse at 85% 90%,rgba(129,140,248,.05) 0%,transparent 45%);}
  .card{position:relative;width:100%;max-width:392px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:38px 32px 30px;text-align:center;box-shadow:0 24px 60px -24px rgba(0,0,0,.6);visibility:hidden;}
  .lock{width:52px;height:52px;border-radius:14px;margin:0 auto 20px;display:grid;place-items:center;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.28);}
  .lock svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2;}
  .badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.22);padding:4px 12px;border-radius:999px;margin-bottom:16px;}
  h1{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;color:#fff;}
  p.sub{font-size:.86rem;color:var(--muted);line-height:1.55;margin-bottom:24px;}
  form{display:flex;flex-direction:column;gap:12px;}
  input{width:100%;background:#0d111f;border:1px solid var(--border2);border-radius:11px;padding:13px 15px;color:var(--text);font-size:.95rem;font-family:inherit;transition:border-color .2s,box-shadow .2s;}
  input::placeholder{color:var(--dim);}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.12);}
  button{width:100%;border:none;border-radius:11px;padding:13px;font-size:.95rem;font-weight:700;font-family:inherit;color:#0a0d1a;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:opacity .2s,transform .1s;}
  button:hover{opacity:.92;} button:active{transform:translateY(1px);} button:disabled{opacity:.55;cursor:wait;}
  .err{font-size:.8rem;color:var(--danger);min-height:18px;opacity:0;transition:opacity .2s;}
  .err.show{opacity:1;}
  .foot{margin-top:22px;font-size:.7rem;color:var(--dim);line-height:1.5;}
  .foot .zn{font-family:'Unbounded',sans-serif;font-weight:900;color:var(--zn);letter-spacing:-.03em;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

    <div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></div>
    <span class="badge">Material confidencial</span>
    <h1>Acesso restrito</h1>
    <p class="sub">Este artefato faz parte do engagement de consultoria do Grupo RBA. Informe a senha de acesso para continuar.</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="Senha de acesso" aria-label="Senha de acesso">
      <button id="btn" type="submit">Entrar</button>
      <div class="err" id="err" role="alert"></div>
    </form>

  function b64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  async function dec(pw){
    var enc=new TextEncoder();
    var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    return new TextDecoder().decode(buf);
  }
  function render(html){
    window.rbaLogout=function(){try{localStorage.removeItem(K);}catch(_){} location.reload();};
    document.open();document.write(html);document.close();
    try{document.body.insertAdjacentHTML('beforeend','<button id="rba-logout" onclick="rbaLogout()" title="Encerrar acesso a todo o hub">&#128274; sair</button><style>#rba-logout{position:fixed;right:14px;bottom:14px;z-index:99999;background:rgba(20,24,41,.92);color:#C6FF00;border:1px solid #2a3055;border-radius:999px;padding:7px 14px;font:600 12px/1 Inter,sans-serif;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}#rba-logout:hover{border-color:#C6FF00;}</style>');}catch(_){}
    try{document.dispatchEvent(new Event('DOMContentLoaded'));window.dispatchEvent(new Event('load'));}catch(_){}
  }
  var card=document.getElementById('card'),f=document.getElementById('f'),pw=document.getElementById('pw'),btn=document.getElementById('btn'),err=document.getElementById('err');
  function showGate(){card.style.visibility='visible';try{pw.focus();}catch(_){}}
  f.addEventListener('submit',async function(e){
    e.preventDefault();err.className='err';btn.disabled=true;btn.textContent='Verificando…';
    try{var html=await dec(pw.value);try{localStorage.setItem(K,pw.value);}catch(_){}render(html);}
    catch(ex){err.textContent='Senha incorreta. Tente novamente.';err.className='err show';btn.disabled=false;btn.textContent='Entrar';pw.value='';pw.focus();}
  });
  (async function(){
    var saved=null;try{saved=localStorage.getItem(K);}catch(_){}
    if(saved){try{var html=await dec(saved);render(html);return;}catch(e){try{localStorage.removeItem(K);}catch(_){}}}
    showGate();
  })();
